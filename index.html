<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batata clicker</title>

    <link rel="shortcut icon" href="imagens/batata.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/configuracoes.css" />
    <link rel="stylesheet" href="css/upgrades.css" />
    <link rel="stylesheet" href="css/powerUps.css" />
    <link rel="stylesheet" href="css/animacoes.css" />
    <link rel="stylesheet" href="css/conquistas.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div id="tudoPraEsquerda">
      <div class="divBatataGrande">
        <img id="imagemBatata" draggable="false" src="imagens/batata.png" width="150" alt="Batata" />
        <div>
          <h1 id="batatas">0 batatas</h1>
          <h2 id="batatasPS">0 batatas por segundo</h2>
        </div>
        <br />
      </div>

      <div id="divPowerups"></div>
      <div id="infoPowerups">
        <p id="nomePowerup"></p>
        <span id="precoPowerup"></span>
        <p id="descricaoPowerup"></p>
      </div>


    </div>
    <div id="tudoPraDireita">
      <br />
      
      <div class="navSecoes">
        <img src="imagens/configuracoes.png" alt="configuracoes">
        <img src="imagens/estatisticas.png" alt="estatisticas">
        <img src="imagens/conquistas.png" alt="conquistas">
      </div>

      <table id="tabelaComprasUpgrades">
        <thead>
          <tr>
            <th><h1>Nome</h1></th>
            <th><h1>Quantidade</h1></th>
            <th><h1>Preço</h1></th>
          </tr>
          <tr>
            <td><button class="botaoMudarNumUpgrade botaoAtivo">x1</button></td>
            <td><button class="botaoMudarNumUpgrade">x10</button></td>
            <td><button class="botaoMudarNumUpgrade">100x</button></td>
          </tr>
        </thead>
        <tbody id="listaUpgrades"></tbody>
      </table>

      <jogo-configuracoes></jogo-configuracoes>
      <jogo-estatisticas></jogo-estatisticas>
      <jogo-conquistas></jogo-conquistas>
      <jogo-upgrades></jogo-upgrades>

    <div id="popupSalvar"><img draggable="false" src="imagens/growing save.gif" alt="salvar" /></div>
    

    <script src="scripts/componentes/estatisticas.js"></script>
    <script src="scripts/componentes/conquistas.js"></script>
    <script src="scripts/componentes/configuracoes.js"></script>
    <script src="scripts/componentes/upgrades.js"></script>

    <script src="scripts/geral.js"></script>
    <script src="scripts/script.js"></script>
    
    <!-- Melhorias in-game -->
    <script src="scripts/upgrades.js"></script>
    <script src="scripts/powerUps.js"></script>
    <script src="scripts/conquistas.js"></script>

    <!-- Outros -->
    <script src="scripts/decoracoes.js"></script>
    <script src="scripts/salvar.js"></script>

    <script defer src="scripts/gameloop.js"></script>
    <script defer src="scripts/addEvents.js"></script>
  </body>
</html>
